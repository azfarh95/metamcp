name: Sentinel — Build and Push Image

# Builds the Sentinel-customized MetaMCP image on every push to the
# `sentinel-patches` branch (tagged `sentinel-latest` + `sentinel-<sha7>`)
# and on dated release tags `v<x.y.z>-sentinel-<yyyymmdd>` (tagged exactly).

on:
  push:
    branches:
      - sentinel-patches
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-sentinel-*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
          today=$(date -u +%Y%m%d)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag_name="${GITHUB_REF#refs/tags/}"
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${tag_name}" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sentinel-latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sentinel-${short_sha},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sentinel-${today}-${short_sha}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Sentinel-customized MetaMCP build
